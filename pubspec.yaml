name: giggl
description: Giggl - Event management marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  razorpay_flutter:
    path: packages/razorpay_flutter
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  timeago: ^3.7.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - .env
